server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy
    location /api/ {
        # Keep /api/... prefix when proxying to backend.
        proxy_pass https://sc-backend.bluesea-831c2673.eastasia.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host sc-backend.bluesea-831c2673.eastasia.azurecontainerapps.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # SPA support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent stale entry HTML from being served at root path.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Ensure clients always fetch the latest entry HTML after redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
